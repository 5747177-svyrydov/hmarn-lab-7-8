<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хмарний Погодний Сервіс</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e0f2fe; color: #1e293b; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        nav { display: flex; gap: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; }
        nav button { background: none; border: none; font-size: 18px; font-weight: 600; color: #64748b; cursor: pointer; padding: 5px 10px; }
        nav button.active { color: #0284c7; border-bottom: 3px solid #0284c7; }
        .page { display: none; }
        .page.active { display: block; }
        .unit-toggle { float: right; background: #0284c7; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .weather-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .weather-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; text-align: center; }
        .temp { font-size: 32px; font-weight: bold; color: #0f172a; margin: 10px 0; }
        select { padding: 10px; width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <button class="unit-toggle" onclick="toggleUnits()">Змінити одиниці (<span id="unit-label">°C</span>)</button>
    
    <nav>
        <button id="btn-home" class="active" onclick="showPage('home')">Головна</button>
        <button id="btn-forecast" onclick="showPage('forecast')">Прогноз</button>
        <button id="btn-cities" onclick="showPage('cities')">Міста</button>
    </nav>

    <div id="home" class="page active">
        <h2>Поточна погода</h2>
        <p>Оберіть місто для отримання актуальних метеорологічних даних:</p>
        <select id="city-select" onchange="updateWeather()">
            <option value="Київ">Київ</option>
            <option value="Одеса">Одеса</option>
            <option value="Львів">Львів</option>
            <option value="Харків">Харків</option>
        </select>
        
        <div class="weather-grid" style="margin-top: 30px;">
            <div class="weather-card" style="grid-column: 1/-1; background: linear-gradient(135deg, #38bdf8, #0284c7); color: white;">
                <h3 id="main-city">Київ</h3>
                <div class="temp" id="main-temp" style="color: white;">+18°C</div>
                <p id="main-cond">Мінлива хмарність</p>
            </div>
        </div>
    </div>

    <div id="forecast" class="page">
        <h2>Прогноз погоди на 3 дні</h2>
        <div class="weather-grid">
            <div class="weather-card">
                <h3>Завтра</h3>
                <div class="temp" id="f1">+20°C</div>
                <p>Сонячно</p>
            </div>
            <div class="weather-card">
                <h3>Післязавтра</h3>
                <div class="temp" id="f2">+16°C</div>
                <p>Дощ</p>
            </div>
            <div class="weather-card">
                <h3>Через 2 дні</h3>
                <div class="temp" id="f3">+19°C</div>
                <p>Хмарно</p>
            </div>
        </div>
    </div>

    <div id="cities" class="page">
        <h2>Огляд температур по містах</h2>
        <div class="weather-grid">
            <div class="weather-card"><h3>Київ</h3><div class="temp class-c">18</div></div>
            <div class="weather-card"><h3>Одеса</h3><div class="temp class-c">22</div></div>
            <div class="weather-card"><h3>Львів</h3><div class="temp class-c">15</div></div>
        </div>
    </div>
</div>

<script>
    let isCelsius = true;
    const weatherData = {
        "Київ": { temp: 18, cond: "Мінлива хмарність", f: [20, 16, 19] },
        "Одеса": { temp: 22, cond: "Ясно, штиль", f: [24, 23, 21] },
        "Львів": { temp: 15, cond: "Хмарно з проясненнями", f: [14, 12, 16] },
        "Харків": { temp: 17, cond: "Невеликий дощ", f: [16, 18, 15] }
    };

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
    }

    function updateWeather() {
        const city = document.getElementById('city-select').value;
        const data = weatherData[city];
        document.getElementById('main-city').innerText = city;
        document.getElementById('main-cond').innerText = data.cond;
        renderTemps();
    }

    function toggleUnits() {
        isCelsius = !isCelsius;
        document.getElementById('unit-label').innerText = isCelsius ? "°C" : "°F";
        renderTemps();
    }

    function renderTemps() {
        const city = document.getElementById('city-select').value;
        const data = weatherData[city];
        
        const toDisplay = (c) => isCelsius ? `+${c}°C` : `+${Math.round(c * 9/5 + 32)}°F`;

        document.getElementById('main-temp').innerText = toDisplay(data.temp);
        document.getElementById('f1').innerText = toDisplay(data.f[0]);
        document.getElementById('f2').innerText = toDisplay(data.f[1]);
        document.getElementById('f3').innerText = toDisplay(data.f[2]);
    }
</script>
</body>
</html>
